name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC Trusted Publishing + provenance

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 24 bundles npm >= 11.12, which covers the >= 11.5.1 that
      # Trusted Publishing needs. Do not install npm@latest on top: the
      # newest npm drops old Node lines and then fails with EBADENGINE.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      - name: Generate types, typecheck, test, build
        run: bun run prepublishOnly

      - name: Publish (Trusted Publishing via OIDC)
        run: npm publish --provenance --access public
